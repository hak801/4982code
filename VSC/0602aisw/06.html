<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function callAlert(){
            let msg = document.getElementById("input1").value;
            alert(msg)
        }
    </script>
</head>
<body>
    <!--<button onclick = "alert('hello world!')">Click Me</button>-->
    <input type = "text" id = "input1" size = "15" placeholder = "Enter Text">
    <button onclick = "callAlert()">Click Me</button>
</body>
</html>
