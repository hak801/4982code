<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소객체 속성 조작</title>
    <script>
        
        window.onload = function(){
            let img1 = document.getElementById("img1");


            // img1.src = "https://placeholder.co/300x200";
            img1.src = "imgs/Bed.jpg"
            img1.windth = 300;
            img1.height = 200;
        }

        function changeImage(btn){
            if(btn.innerText == "침대 이미지 변경"){
                img1.src = "imgs/GANADI.png";
                btn.innerText = "강아지 이미지 변경";
            } else {
                img1.src = "imgs/Bed.jpg";
                btn.innerText = "침대 이미지 변경";
            }
            
        }
    </script>
</head>
<body>
    <button onclick = "changeImage(this)">침대 이미지 변경 버튼</button>
    <img id = "img1">
</body>
</html>
